version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: exampixel
      POSTGRES_PASSWORD: exampixel
      POSTGRES_DB: exampixel_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend_fastapi/:/app
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://exampixel:exampixel@db:5432/exampixel_db
      JWT_SECRET: change_me
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - db

volumes:
  db_data:
